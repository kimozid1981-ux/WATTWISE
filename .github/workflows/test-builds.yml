name: Test builds (Android APK + Windows EXE)

# Builds installable TEST versions of WATTWISE from the offline static web bundle
# (local mode: data stays on the device, DEMO data and manual bill entry work,
# AI bill reading is not available because it needs the server).
on:
  workflow_dispatch:
  push:
    branches: [main, 'claude/**']

jobs:
  web-static:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx -y npm@11 ci --no-audit --no-fund
      - run: npm run build:static -w @wattwise/web
      - uses: actions/upload-artifact@v4
        with:
          name: web-static
          path: apps/web/out
          retention-days: 7

  android:
    needs: web-static
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/download-artifact@v4
        with:
          name: web-static
          path: apps/web/out
      - name: Install Capacitor
        working-directory: native/android
        run: npx -y npm@11 ci --no-audit --no-fund
      - name: Sync web bundle into the Android project
        working-directory: native/android
        run: npx cap sync android
      - name: Build debug APK
        working-directory: native/android/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/WATTWISE-android-test.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: WATTWISE-android-test-apk
          path: WATTWISE-android-test.apk
          retention-days: 30

  windows:
    needs: web-static
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: web-static
          path: apps/web/out
      - name: Install Electron tooling
        working-directory: native/desktop
        run: npm install --no-audit --no-fund
      - name: Build portable Windows EXE
        working-directory: native/desktop
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: WATTWISE-windows-test-exe
          path: native/desktop/dist/*.exe
          retention-days: 30

  # Publishes the two files as a GitHub pre-release so they can be downloaded
  # directly (e.g. on a phone) without unzipping workflow artifacts.
  publish:
    needs: [android, windows]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: WATTWISE-*-test-*
          merge-multiple: true
          path: release
      - name: Create pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="test-build-${{ github.run_number }}"
          gh release create "$TAG" release/* \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --prerelease \
            --title "WATTWISE test build ${{ github.run_number }}" \
            --notes "Test build from commit ${{ github.sha }} (branch ${{ github.ref_name }}). Offline local mode: DEMO data and manual bill entry work; AI bill reading needs the online server. Android: allow installs from unknown sources. Windows: unsigned, SmartScreen may warn (More info → Run anyway)."
